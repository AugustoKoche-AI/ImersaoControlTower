bundle:
  name: torre-atlas

include:
  - resources/*.yml

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.

resources:
  apps:
    app:
      name: "torre-atlas"
      description: "Torre de Controle da Atlas Engenharia: obras em risco, realocação e aprovação da diretoria"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-84cd5511-fa25.cloud.databricks.com

    variables:
      sql_warehouse_id: 666be37e3fededf2
      genie_space_id: 01f1cb0e05f719b6b71edafc85b5658b
      genie_space_name: Torre de Controle · Diretoria + Contratos
      postgres_branch: projects/torre-atlas/branches/production
      postgres_database: projects/torre-atlas/branches/production/databases/databricks-postgres
