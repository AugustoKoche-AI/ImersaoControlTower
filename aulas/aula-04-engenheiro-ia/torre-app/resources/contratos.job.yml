# O agente que lê contrato e manual, como job: PDF → elementos → cláusulas e seções → colunas tipadas.
# Roda no SQL warehouse serverless (~1 min para os 9 PDFs).
resources:
  jobs:
    farol_contratos:
      name: farol_contratos
      description: "Noite 4 · ai_parse_document + ai_extract (schema tipado) nos contratos de fornecedor e no manual → gold.contratos_*, gold.manual_secoes"
      tasks:
        - task_key: contratos
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../agente/01-contratos.sql
