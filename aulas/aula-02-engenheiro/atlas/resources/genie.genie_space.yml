# O Genie Agent da Torre como CÓDIGO.
#
# Na noite 1 o Genie foi plugado direto na bronze e respondeu "CPI de 7,01"
# com toda a confiança. Hoje ele lê a gold, com COMMENT em toda tabela, as
# métricas governadas (mv_*) e instruções de negócio escritas.
#
# O modelo é o MESMO. O que mudou foi tudo que está embaixo dele.
#
# As instruções (o "hoje" do dataset, as regras de corte, onde achar a causa do
# atraso) passam a ter histórico, revisão e rollback, como qualquer código.
# Para mudar: edite scripts/gerar_genie.py, gere o JSON e faça deploy.

resources:
  genie_spaces:
    genie_torre:
      title: Torre de Controle · Diretoria
      description: >-
        Pergunte em português sobre as 40 obras da Atlas Engenharia: prazo e custo (SPI, CPI,
        estouro), gente e equipamento parado, material que vai faltar e por que cada obra atrasou.
      file_path: ../resources/torre.geniespace.json
      warehouse_id: ${var.warehouse_id}
