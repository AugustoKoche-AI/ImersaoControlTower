# O job da Torre de Controle — a sequência que a noite 2 constrói.
#
# Abra o DAG no workspace depois de cada deploy: o desenho crescendo é a melhor
# tela da aula.
#
#   prompt 1  conferencia_bronze
#   prompt 2  + medalhao (pipeline Lakeflow: silver)
#   prompt 3  + (o mesmo pipeline ganha a gold) + testes_de_qualidade
#   prompt 4  + rdo_com_ia
#   prompt 5  + metricas_governadas
#   noite 3   + ml_features → ml_modelo → ml_score
#
# A ordem não é sugestão: cada camada lê a anterior. Se a conferência da bronze
# falhar, nada roda — e é isso que impede o dashboard de mostrar meio dado com
# cara de dado inteiro.

resources:
  jobs:
    atlas_torre:
      name: atlas_torre
      description: Torre de Controle da Atlas Engenharia — conferência, medalhão, IA nos RDOs, testes e métricas governadas.

      # Todo dia às 6h (pausado em dev pelo preset do databricks.yml).
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo

      tasks:
        # ── 1. a bronze está inteira? ─────────────────────────────────
        - task_key: conferencia_bronze
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql

        # ── 2. o medalhão: silver e gold num pipeline declarativo ─────
        - task_key: medalhao
          depends_on: [{ task_key: conferencia_bronze }]
          pipeline_task:
            pipeline_id: ${resources.pipelines.atlas_medalhao.id}

        # ── 3. os testes que quebram o job antes de quebrar o dashboard
        - task_key: testes_de_qualidade
          depends_on: [{ task_key: medalhao }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/testes/testes.sql

        # ── 4. o RDO em texto vira coluna ─────────────────────────────
        - task_key: rdo_com_ia
          depends_on: [{ task_key: medalhao }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ia/rdo_estruturado.sql

        # ── 5. os KPIs definidos uma vez só ───────────────────────────
        - task_key: metricas_governadas
          depends_on:
            - { task_key: testes_de_qualidade }
            - { task_key: rdo_com_ia }
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/metricas/metricas.sql

        # ── noite 3 · ML é mais uma camada do mesmo pipeline ─────────
        # 6. as features: uma linha por obra e semana, só olhando para trás
        - task_key: ml_features
          depends_on: [{ task_key: metricas_governadas }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/01-features.sql

        # 7. o modelo: baseline, treino, testes, MLflow e Unity Catalog (@prod)
        - task_key: ml_modelo
          depends_on: [{ task_key: ml_features }]
          notebook_task:
            notebook_path: ../src/ml/02-modelo.py
            base_parameters:
              catalog: ${var.catalog}

        # 8. o score de hoje: a lista que a diretoria abre na segunda
        - task_key: ml_score
          depends_on: [{ task_key: ml_modelo }]
          notebook_task:
            notebook_path: ../src/ml/03-score.py
            base_parameters:
              catalog: ${var.catalog}
